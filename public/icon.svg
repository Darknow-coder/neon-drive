<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3a1478"/>
      <stop offset="0.55" stop-color="#140a3a"/>
      <stop offset="1" stop-color="#07041a"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007f8a"/>
      <stop offset="0.5" stop-color="#7ffbff"/>
      <stop offset="1" stop-color="#007f8a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <!-- Grille au sol en perspective -->
  <g stroke="#8a2bff" stroke-opacity="0.45" stroke-width="3">
    <path d="M0 360 H512 M0 400 H512 M0 450 H512 M0 505 H512"/>
    <path d="M256 330 L-120 512 M256 330 L60 512 M256 330 L180 512 M256 330 L332 512 M256 330 L452 512 M256 330 L632 512"/>
  </g>
  <!-- Bordures de piste néon -->
  <g filter="url(#glow)" fill="none" stroke-width="10" stroke-linecap="round">
    <path d="M226 330 L96 512" stroke="#00f0ff"/>
    <path d="M286 330 L416 512" stroke="#ff2bd6"/>
  </g>
  <!-- Soleil rétro -->
  <circle cx="256" cy="250" r="92" fill="#ff2bd6" opacity="0.18" filter="url(#glow)"/>
  <!-- Voiture vue de dessus -->
  <g transform="translate(256 300) rotate(-90)" filter="url(#glow)">
    <path d="M70 0 C66 -16 50 -30 20 -32 L-56 -36 C-70 -36 -74 -26 -74 0 C-74 26 -70 36 -56 36 L20 32 C50 30 66 16 70 0 Z" fill="url(#car)" stroke="#bffcff" stroke-width="4"/>
    <path d="M30 0 C26 -14 8 -20 -14 -20 L-30 -16 L-30 16 L-14 20 C8 20 26 14 30 0 Z" fill="#0a0a26"/>
    <rect x="-80" y="-34" width="10" height="68" rx="3" fill="#ff2bd6"/>
    <rect x="-74" y="-6" width="140" height="4" fill="#ff2bd6" opacity="0.8"/>
  </g>
</svg>
