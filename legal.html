<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEON//DRIVE — Confidentialité et conditions</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/styles/fonts.css" />
  <style>
    body { margin: 0; background: #07041a; color: #e8e6ff; font-family: 'Rajdhani', system-ui, sans-serif; font-size: 17px; line-height: 1.5; }
    main { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
    .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 28px; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px #00f0ff; text-decoration: none; }
    .logo span { color: #ff2bd6; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
    nav a { font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 1px; color: #7af7ff; border: 1px solid rgba(0,240,255,.4); padding: 8px 12px; border-radius: 10px; text-decoration: none; }
    section { margin-top: 30px; padding-top: 10px; border-top: 1px solid rgba(138,43,255,.35); }
    h2 { font-family: 'Orbitron', sans-serif; font-size: 20px; letter-spacing: 2px; color: #fff; }
    h3 { font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 1px; color: #ff9fe8; margin-top: 22px; }
    a { color: #7af7ff; } b { color: #fff; }
    .lg-lead { padding: 12px 14px; border-radius: 12px; background: rgba(0,240,255,.08); border: 1px solid rgba(0,240,255,.3); }
    .back { display: inline-block; margin-top: 30px; }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="./">NEON<span>//</span>DRIVE</a>
    <nav><a href="#privacy">CONFIDENTIALITÉ</a><a href="#terms">CONDITIONS D'UTILISATION</a><a href="#legal">MENTIONS LÉGALES</a></nav>
    <div id="content"></div>
    <a class="back" href="./">‹ Retour au jeu</a>
  </main>
  <script type="module">
    import { LEGAL, LEGAL_UPDATED } from '/src/data/legal.js';
    document.getElementById('content').innerHTML = Object.entries(LEGAL)
      .map(([id, d]) => `<section id="${id}"><h2>${d.title}</h2>${d.html()}</section>`).join('') + `<p>Mise à jour : ${LEGAL_UPDATED}</p>`;
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
  </script>
</body>
</html>
